<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro do Aluno</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a href="index.html" class="btn-voltar">
            ← Voltar para o menu
        </a>

        <header class="topo">
            <h1>Cadastro do Aluno</h1>
            <p>Identificação e cadastro do aluno</p>
        </header>

        <main class="card">

            <div class="card-header">
                <h2>Dados do Aluno</h2>
                <p>Preencha as informações abaixo.</p>
            </div>

            <form id="formAluno">

                <div class="form-grid">

                    <div class="campo">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" required>
                    </div>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="dataNascimento">Data de nascimento</label>
                        <input type="date" id="dataNascimento" required>
                    </div>

                    <div class="campo">
                        <label for="turma">Turma</label>
                        <input type="text" id="turma" placeholder="Ex.: 8º Ano A" required>
                    </div>

                    <div class="campo">
                        <label for="responsavel">Nome do responsável</label>
                        <input type="text" id="responsavel" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone do responsável</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                    </div>

                </div>

                <div class="acoes">

                    <a href="index.html" class="btn-secundario">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-principal">
                        Cadastrar aluno
                    </button>

                </div>

            </form>

        </main>

    </div>

    <script>
        document.getElementById("formAluno").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Aluno cadastrado com sucesso!");

        });
    </script>

</body>

</html>
