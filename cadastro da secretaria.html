<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro da Secretaria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a href="index.html" class="btn-voltar">
            ← Voltar para o menu
        </a>

        <header class="topo">
            <h1>Cadastro da Secretaria</h1>
            <p>Cadastro do responsável pelo atendimento na secretaria</p>
        </header>

        <main class="card">

            <div class="card-header">
                <h2>Dados da Secretaria</h2>
                <p>Informe os dados do funcionário.</p>
            </div>

            <form id="formSecretaria">

                <div class="form-grid">

                    <div class="campo">
                        <label for="idAtendente">
                            ID do atendente
                        </label>

                        <input
                            type="text"
                            id="idAtendente"
                            placeholder="Ex.: SEC001"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="nomeSecretaria">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nomeSecretaria"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cargo">
                            Cargo
                        </label>

                        <input
                            type="text"
                            id="cargo"
                            value="Secretaria"
                            readonly
                        >
                    </div>

                    <div class="campo">
                        <label for="telefoneSecretaria">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefoneSecretaria"
                            placeholder="(00) 00000-0000"
                        >
                    </div>

                    <div class="campo campo-grande">
                        <label for="emailSecretaria">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="emailSecretaria"
                            placeholder="exemplo@email.com"
                        >
                    </div>

                </div>

                <div class="acoes">

                    <a href="index.html" class="btn-secundario">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-principal">
                        Cadastrar secretaria
                    </button>

                </div>

            </form>

        </main>

    </div>

    <script>
        document.getElementById("formSecretaria").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Secretaria cadastrada com sucesso!");

        });
    </script>

</body>

</html>
